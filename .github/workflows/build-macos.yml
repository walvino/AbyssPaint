name: Build macOS App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build AbyssPaint for macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List available Xcode versions
        run: |
          ls -la /Applications/ | grep Xcode
          xcodebuild -version

      - name: Select Xcode (latest available)
        run: |
          # Find latest Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Show project schemes
        run: |
          cd AbyssPaint
          xcodebuild -list -project AbyssPaint.xcodeproj

      - name: Build Release (no code signing)
        run: |
          cd AbyssPaint
          # Try building with target instead of scheme (more reliable)
          xcodebuild build \
            -project AbyssPaint.xcodeproj \
            -target AbyssPaint \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -50

      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find AbyssPaint/build -name "AbyssPaint.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find AbyssPaint/build -type f -name "*.app" 2>/dev/null | head -5
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          ls -la "$APP_PATH"

      - name: Verify app structure
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          echo "=== App bundle ==="
          ls -la "$APP_PATH"
          echo "=== Info.plist ==="
          plutil -p "$APP_PATH/Contents/Info.plist"
          echo "=== Executable ==="
          file "$APP_PATH/Contents/MacOS/AbyssPaint"

      - name: Create zip artifact
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ditto -c -k --keepParent "$APP_PATH" AbyssPaint-macOS.zip
          echo "Created AbyssPaint-macOS.zip ($(du -h AbyssPaint-macOS.zip | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbyssPaint-macOS
          path: AbyssPaint-macOS.zip
          retention-days: 7

      - name: Summary
        if: success()
        run: |
          echo "## Build Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`AbyssPaint-macOS.zip\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To install:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact from Actions page" >> $GITHUB_STEP_SUMMARY
          echo "2. Unzip" >> $GITHUB_STEP_SUMMARY
          echo "3. Right-click \`AbyssPaint.app\` → **Open**" >> $GITHUB_STEP_SUMMARY
          echo "4. Click **Open** in Gatekeeper dialog" >> $GITHUB_STEP_SUMMARY