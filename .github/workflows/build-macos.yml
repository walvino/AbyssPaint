name: Build AbyssPaint for macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build arm64
        run: swift build -c release --arch arm64 --scratch-path .build-arm64

      - name: Build x86_64
        run: swift build -c release --arch x86_64 --scratch-path .build-x86_64

      - name: Assemble AbyssPaint.app
        run: |
          set -euo pipefail
          ARM_BIN=$(swift build -c release --arch arm64 --scratch-path .build-arm64 --show-bin-path)
          INTEL_BIN=$(swift build -c release --arch x86_64 --scratch-path .build-x86_64 --show-bin-path)

          APP=dist/AbyssPaint.app
          rm -rf dist
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          lipo -create "$ARM_BIN/AbyssPaint" "$INTEL_BIN/AbyssPaint" -output "$APP/Contents/MacOS/AbyssPaint"
          cp Support/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          chmod +x "$APP/Contents/MacOS/AbyssPaint"

          if [ -f Support/AppIcon.icns ]; then
            cp Support/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          fi

          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/AbyssPaint"
          ditto -c -k --keepParent "$APP" AbyssPaint-macOS.zip
          shasum -a 256 AbyssPaint-macOS.zip
          du -h AbyssPaint-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AbyssPaint-macOS
          path: AbyssPaint-macOS.zip
          retention-days: 14
