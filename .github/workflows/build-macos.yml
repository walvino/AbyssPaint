name: Build macOS App (Minimal)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build AbyssPaint for macOS
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== AbyssPaint dir ==="
          ls -la AbyssPaint/

      - name: Show project structure
        run: |
          echo "=== Swift files ==="
          find AbyssPaint -name "*.swift" -o -name "*.metal" | head -30
          echo "=== xcodebuild -list ==="
          xcodebuild -list -project AbyssPaint.xcodeproj 2>&1

      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode_15.3.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.2.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.0.app 2>/dev/null
          fi
          xcodebuild -version

      - name: Build (from root, project is in root)
        id: build
        run: |
          # Build from root directory where .xcodeproj lives
          xcodebuild build \
            -project AbyssPaint.xcodeproj \
            -target AbyssPaint \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "BUILD_EXIT=$BUILD_EXIT" >> $GITHUB_OUTPUT
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED - Full log ==="
            cat build.log
          else
            echo "=== BUILD SUCCEEDED ==="
          fi

      - name: Find .app
        if: steps.build.outputs.BUILD_EXIT == '0'
        id: locate
        run: |
          APP_PATH=$(find . -name "AbyssPaint.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found"
            find . -name "*.app" -type d 2>/dev/null
            exit 1
          fi
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          ls -la "$APP_PATH"

      - name: Zip artifact
        if: steps.build.outputs.BUILD_EXIT == '0'
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          ditto -c -k --keepParent "$APP_PATH" AbyssPaint-macOS.zip
          echo "Created $(du -h AbyssPaint-macOS.zip | cut -f1)"

      - name: Upload app
        if: steps.build.outputs.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: AbyssPaint-macOS
          path: AbyssPaint-macOS.zip
          retention-days: 7

      - name: Upload build log (always)
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7